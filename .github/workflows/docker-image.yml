name: Build and Push Critca docker Image

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Spring Boot JAR with Maven
        run: mvn clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Remove old container (if exists)
        run: |
          docker ps -aq --filter "name=critica" | grep -q . && docker rm -f critica || echo "No old container found"

      - name: Build Docker image from Dockerfile
        run: docker build -t pollylo/critica:latest -t critica:latest .

      - name: Push image to Docker Hub
        run: docker push pollylo/critica:latest
